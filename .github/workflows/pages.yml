name: Publish browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble verified runtime
        run: |
          mkdir _site
          cp index.html index.js index.wasm index.*.js index*.png *.LICENSE.txt _site/
          cat .chunks/index.pck.* > _site/index.pck
          cd _site
          sha256sum -c ../index.pck.sha256
          touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
