name: Publish browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble verified runtime
        run: |
          mkdir _site
          cp index.html index.js index.wasm index.*.js index*.png *.LICENSE.txt versions.html _site/
          for variant in . 2d 3d; do
            mkdir -p "_site/$variant"
            if [ "$variant" != . ]; then
              cp "$variant"/index.html "$variant"/index.js "$variant"/index.wasm "$variant"/index.*.js "$variant"/index*.png "$variant"/release.json "_site/$variant/"
            fi
            cat "$variant"/.chunks/index.pck.* > "_site/$variant/index.pck"
            (cd "_site/$variant" && sha256sum -c "$GITHUB_WORKSPACE/$variant/index.pck.sha256")
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
